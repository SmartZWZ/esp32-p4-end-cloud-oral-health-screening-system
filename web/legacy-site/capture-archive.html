<!doctype html>
<html lang="zh-CN" data-page="capture-archive" data-protected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>全口采集档案 · 齿镜</title>
  <link rel="icon" href="cj.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/refine.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/polish.css">
  <link rel="stylesheet" href="assets/css/member-profile.css?v=20260813-archive">
  <link rel="stylesheet" href="assets/css/capture-archive.css?v=20260822-archive-manage-v1">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="dashboard.html"><img src="cj.svg" alt="齿镜"><span class="brand-name">齿镜<small>DentiScope</small></span></a>
<nav><a href="dashboard.html">概览</a><a href="devices.html">设备</a><a class="active" href="members.html">成员</a><a href="detections.html">影像</a><a href="dental-model-demo.html">牙列模型</a><a href="ai-dentist.html">AI牙医</a><a href="assistant.html">助手</a></nav>
    <button class="theme-toggle" type="button">切换主题</button>
    <button class="logout-button" type="button">退出</button>
  </header>

  <main class="app-main capture-archive-main">
    <a id="capture-archive-back" class="member-profile-back" href="members.html">← 返回成员档案</a>
    <section class="capture-archive-hero">
      <div>
        <p class="kicker">SEVEN-VIEW CAPTURE FILE</p>
        <h1 id="capture-archive-title">正在读取全口采集档案</h1>
        <p id="capture-archive-meta">—</p>
      </div>
      <div class="capture-archive-actions">
        <a id="capture-archive-model" class="button button-fill" href="dental-model-demo.html">生成牙列模型</a>
        <a id="capture-archive-report" class="button button-plain" href="family-reports.html">生成口腔综合报告</a>
        <a id="capture-archive-images" class="button button-plain" href="detections.html">在影像管理中查看</a>
        <button id="capture-archive-delete" class="button button-plain capture-archive-delete" type="button">删除档案</button>
      </div>
    </section>
    <p id="capture-archive-message" class="member-profile-message" role="status" aria-live="polite"></p>
    <aside id="capture-model-state" class="capture-model-state" aria-live="polite"></aside>

    <section class="capture-archive-summary">
      <div class="capture-summary-state">
        <span id="capture-archive-status">读取中</span>
        <strong id="capture-archive-count">—/7</strong>
      </div>
      <div class="capture-summary-progress" aria-hidden="true"><i id="capture-archive-progress"></i></div>
      <p id="capture-archive-guidance">正在核对七个标准拍摄位置。</p>
    </section>

    <section class="capture-archive-section">
      <header class="capture-section-head">
        <div><p class="kicker">STANDARD VIEWS</p><h2>七个标准拍摄位置</h2></div>
      <p>点击照片可进入查看与编辑，也可以下载原图或进入模型处理。</p>
      </header>
      <div id="capture-archive-grid" class="capture-archive-grid"><p class="member-profile-empty">正在整理照片…</p></div>
    </section>

    <section class="capture-archive-section">
      <header class="capture-section-head">
        <div><p class="kicker">RELATED REPORTS</p><h2>与本次采集有关的报告</h2></div>
        <span id="capture-report-total">—</span>
      </header>
      <div id="capture-report-list" class="capture-report-list"><p class="member-profile-empty">正在读取关联报告…</p></div>
    </section>
  </main>

  <dialog id="capture-image-preview" class="member-image-preview">
    <header><div><strong id="capture-preview-title">口腔照片</strong><span id="capture-preview-meta">—</span></div><button id="capture-preview-close" type="button" aria-label="关闭预览">×</button></header>
    <div class="member-preview-stage"><img id="capture-preview-image" alt="全口档案中的口腔照片"></div>
    <footer><a id="capture-preview-download" class="button button-plain" download>下载原图</a><a id="capture-preview-model" class="button button-fill">模型处理</a></footer>
  </dialog>

  <input id="capture-fill-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<script src="assets/js/capture-archive.js?v=20260822-archive-manage-v1"></script>
<script src="assets/js/app.js?v=20260815-editor-v1"></script>
</body>
</html>
