<!doctype html>
<html lang="zh-CN" data-page="register"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>创建账户 — 齿镜</title><link rel="icon" href="cj.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/refine.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/polish.css"></head>
<body><header class="site-header"><a class="wordmark" href="index.html"><img src="cj.svg" alt="齿镜"><span class="brand-name">齿镜<small>DentiScope</small></span></a><nav><a href="login.html">登录</a></nav><button class="theme-toggle" type="button">切换主题</button></header><main class="auth-main"><section class="auth-intro"><p class="kicker">FIRST RECORD</p><h1>为每一次<br>观察留档。</h1><p>创建账户后即可绑定你的 ESP32-P4 设备。影像记录只对当前账户开放。</p></section><section class="auth-panel"><p class="panel-index">账户 / 注册</p><h2>创建账户</h2><form id="register-form" class="form-stack"><label>昵称<input name="nickname" autocomplete="nickname" placeholder="如何称呼你" minlength="2" maxlength="64" required></label><label>邮箱<input type="email" name="email" autocomplete="email" placeholder="name@example.com" required></label><label>设置密码<span class="input-action"><input type="password" name="password" autocomplete="new-password" placeholder="至少 8 位字符" minlength="8" required><button type="button" class="password-toggle">显示</button></span></label><label>确认密码<span class="input-action"><input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle">显示</button></span></label><p id="auth-message" class="form-message" role="alert"></p><button class="button button-fill" type="submit">创建账户</button></form><p class="form-footnote">注册即表示你了解：平台仅提供辅助筛查信息，不构成医疗诊断。</p></section></main><script src="assets/js/app.js?v=20260812-diagnostics"></script></body></html>
