<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>齿镜智能口腔健康系统结构图</title>
  <desc>展示用户、网页端、ESP32-P4智能硬件、齿镜云端平台、AI服务和云端数据中心之间的数据流。</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#172033" flood-opacity=".07"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2674D9"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7557C8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <style>
      .cn{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif}
      .en{font-family:Inter,Arial,sans-serif;letter-spacing:2px}
      .ink{fill:#162033}.muted{fill:#667085}.quiet{fill:#98A2B3}
      .section-label{font-size:13px;font-weight:700}.card-title{font-size:24px;font-weight:700}
      .card-copy{font-size:16px}.module-title{font-size:19px;font-weight:700}.module-copy{font-size:14px}
      .flow-label{font-size:13px;font-weight:700}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F7F9FC"/>
  <circle cx="1780" cy="78" r="160" fill="#EEF4FF"/>
  <circle cx="1840" cy="1020" r="210" fill="#F2F0FB"/>

  <!-- Title -->
  <g id="title">
    <text x="70" y="72" class="cn ink" font-size="43" font-weight="750">齿镜智能口腔健康系统</text>
    <text x="72" y="108" class="cn muted" font-size="17">从口腔影像采集、智能分析到语音交互与设备控制</text>
    <g transform="translate(1646 49)">
      <rect width="204" height="48" rx="24" fill="#FFFFFF" stroke="#D8DEE8"/>
      <text x="102" y="30" text-anchor="middle" class="en muted" font-size="12" font-weight="700">SYSTEM OVERVIEW</text>
    </g>
  </g>

  <!-- Column labels -->
  <text x="70" y="166" class="en muted section-label">USER</text>
  <text x="300" y="166" class="en muted section-label">APPLICATION &amp; DEVICE</text>
  <text x="752" y="166" class="en muted section-label">CLOUD PLATFORM</text>
  <text x="1428" y="166" class="en muted section-label">AI SERVICES &amp; DATA</text>

  <!-- User -->
  <g id="layer-user" filter="url(#cardShadow)">
    <rect x="70" y="190" width="180" height="655" rx="28" fill="#FFFFFF" stroke="#D8DEE8"/>
    <g transform="translate(105 288)">
      <circle cx="55" cy="55" r="53" fill="#EEF2F7"/>
      <circle cx="55" cy="42" r="19" fill="none" stroke="#1E293B" stroke-width="3"/>
      <path d="M19 95c7-24 22-35 36-35s29 11 36 35" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="160" y="440" text-anchor="middle" class="cn ink card-title">用户</text>
    <text x="160" y="477" text-anchor="middle" class="cn muted card-copy">网页操作</text>
    <text x="160" y="507" text-anchor="middle" class="cn muted card-copy">设备使用</text>
    <line x1="105" y1="557" x2="215" y2="557" stroke="#E4E8EF"/>
    <text x="160" y="604" text-anchor="middle" class="cn muted" font-size="14">家庭成员</text>
    <text x="160" y="634" text-anchor="middle" class="cn muted" font-size="14">口腔健康管理</text>
  </g>

  <!-- Entry cards -->
  <g id="layer-entry">
    <g id="component-web" filter="url(#cardShadow)">
      <rect x="300" y="190" width="350" height="305" rx="28" fill="#FFFFFF" stroke="#D8DEE8"/>
      <rect x="324" y="214" width="302" height="128" rx="18" fill="#F1F5FA"/>
      <g id="replace-web-visual" transform="translate(412 230)">
        <rect x="0" y="0" width="126" height="78" rx="8" fill="#FFFFFF" stroke="#1F2A3D" stroke-width="3"/>
        <line x1="10" y1="18" x2="116" y2="18" stroke="#CBD3DF" stroke-width="2"/>
        <circle cx="18" cy="9" r="3" fill="#2674D9"/>
        <rect x="14" y="31" width="43" height="32" rx="5" fill="#E7EFFC"/>
        <line x1="70" y1="34" x2="108" y2="34" stroke="#667085" stroke-width="3" stroke-linecap="round"/>
        <line x1="70" y1="47" x2="102" y2="47" stroke="#CBD3DF" stroke-width="3" stroke-linecap="round"/>
        <line x1="70" y1="60" x2="93" y2="60" stroke="#CBD3DF" stroke-width="3" stroke-linecap="round"/>
        <path d="M47 90h32M57 78v12M69 78v12" stroke="#1F2A3D" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="328" y="385" class="cn ink card-title">齿镜网页端</text>
      <text x="328" y="420" class="cn muted card-copy">管理成员、设备与口腔影像</text>
      <text x="328" y="451" class="cn muted" font-size="14">模型工作台 · AI 助手 · AI 牙医</text>
    </g>

    <g id="component-device" filter="url(#cardShadow)">
      <rect x="300" y="540" width="350" height="305" rx="28" fill="#FFFFFF" stroke="#D8DEE8"/>
      <rect x="324" y="564" width="302" height="128" rx="18" fill="#F1F5FA"/>
      <g id="replace-device-visual" transform="translate(420 578)">
        <rect x="0" y="0" width="110" height="94" rx="18" fill="#FFFFFF" stroke="#1F2A3D" stroke-width="3"/>
        <rect x="13" y="14" width="84" height="52" rx="9" fill="#E7EFFC"/>
        <circle cx="55" cy="40" r="17" fill="#FFFFFF" stroke="#2674D9" stroke-width="3"/>
        <circle cx="55" cy="40" r="7" fill="#2674D9"/>
        <circle cx="55" cy="80" r="4" fill="#1F2A3D"/>
        <path d="M-20 22h19M111 22h19M-20 72h19M111 72h19" stroke="#98A2B3" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="328" y="735" class="cn ink card-title">齿镜智能硬件</text>
      <text x="328" y="770" class="cn muted card-copy">ESP32-P4 · OV5647</text>
      <text x="328" y="801" class="cn muted" font-size="14">摄像头 · 麦克风 · 屏幕 · 扬声器</text>
    </g>
  </g>

  <!-- User connectors -->
  <path d="M250 352 H282 Q290 352 290 344 V327 Q290 319 300 319" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <path d="M250 642 H282 Q290 642 290 650 V667 Q290 675 300 675" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Cloud -->
  <g id="layer-cloud" filter="url(#cardShadow)">
    <rect x="752" y="190" width="570" height="655" rx="30" fill="#FFFFFF" stroke="#C9D2E1"/>
    <rect x="752" y="190" width="570" height="92" rx="30" fill="#172033"/>
    <path d="M752 252h570v30H752z" fill="#172033"/>
    <circle cx="795" cy="236" r="18" fill="#2674D9"/>
    <path d="M787 237c3-9 14-9 17 0M790 243h11" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <text x="832" y="231" class="cn" fill="#FFFFFF" font-size="25" font-weight="700">齿镜云端平台</text>
    <text x="832" y="257" class="en" fill="#AAB6C8" font-size="11">SERVICE ORCHESTRATION</text>

    <g id="cloud-business">
      <rect x="784" y="314" width="506" height="126" rx="20" fill="#F6F8FB" stroke="#DFE4EC"/>
      <rect x="806" y="337" width="52" height="52" rx="14" fill="#E9EEF5"/>
      <path d="M819 365h26M824 354h16M824 375h16" stroke="#344054" stroke-width="2.5" stroke-linecap="round"/>
      <text x="884" y="354" class="cn ink module-title">账号、成员与设备</text>
      <text x="884" y="386" class="cn muted module-copy">登录注册 · 家庭成员 · 设备绑定 · 数据隔离</text>
      <text x="884" y="413" class="en quiet" font-size="10">ACCOUNT / MEMBER / DEVICE</text>
    </g>

    <g id="cloud-image">
      <rect x="784" y="465" width="506" height="126" rx="20" fill="#F3F7FE" stroke="#D4E1F5"/>
      <rect x="806" y="488" width="52" height="52" rx="14" fill="#E2EDFC"/>
      <rect x="819" y="501" width="26" height="23" rx="4" fill="none" stroke="#2674D9" stroke-width="2.5"/>
      <path d="M822 519l7-7 5 5 5-5 6 7" fill="none" stroke="#2674D9" stroke-width="2.2"/>
      <text x="884" y="505" class="cn ink module-title">影像与模型任务</text>
      <text x="884" y="537" class="cn muted module-copy">影像上传 · 历史管理 · 模型调度 · 结果汇总</text>
      <text x="884" y="564" class="en quiet" font-size="10">IMAGE / MODEL TASK</text>
    </g>

    <g id="cloud-assistant">
      <rect x="784" y="616" width="506" height="126" rx="20" fill="#F6F3FC" stroke="#E0D8F1"/>
      <rect x="806" y="639" width="52" height="52" rx="14" fill="#ECE6F8"/>
      <path d="M820 653h24v18h-11l-7 7v-7h-6z" fill="none" stroke="#7557C8" stroke-width="2.4" stroke-linejoin="round"/>
      <text x="884" y="656" class="cn ink module-title">AI 助手与设备服务</text>
      <text x="884" y="688" class="cn muted module-copy">连续对话 · 信息读取 · 语音交互 · 指令下发</text>
      <text x="884" y="715" class="en quiet" font-size="10">AI ASSISTANT / DEVICE SERVICE</text>
    </g>

    <g transform="translate(784 774)">
      <circle cx="8" cy="8" r="8" fill="#DFF3E8"/>
      <path d="M4 8l3 3 5-6" fill="none" stroke="#21895B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="13" class="cn muted" font-size="13">统一处理网页端与硬件端的业务请求</text>
    </g>
  </g>

  <!-- Entry to cloud flows -->
  <g id="flow-image">
    <path d="M650 365 H714 Q730 365 730 381 V510 Q730 528 752 528" fill="none" stroke="#2674D9" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M650 676 H706 Q730 676 730 652 V558 Q730 538 752 538" fill="none" stroke="#2674D9" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="665" y="476" width="72" height="28" rx="14" fill="#E7EFFC"/>
    <text x="701" y="495" text-anchor="middle" class="cn" fill="#1F5EAF" font-size="12" font-weight="700">口腔影像</text>
  </g>

  <g id="flow-voice">
    <path d="M650 730 H714 Q730 730 730 714 V688 Q730 678 752 678" fill="none" stroke="#7557C8" stroke-width="4" marker-end="url(#arrowPurple)"/>
    <rect x="665" y="700" width="72" height="28" rx="14" fill="#EEE9F8"/>
    <text x="701" y="719" text-anchor="middle" class="cn" fill="#6045A8" font-size="12" font-weight="700">语音交互</text>
  </g>

  <g id="flow-control">
    <path d="M784 727 H710 Q686 727 686 751 V781 Q686 796 650 796" fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 8" marker-end="url(#arrowOrange)"/>
    <rect x="676" y="762" width="96" height="28" rx="14" fill="#FFF1DB"/>
    <text x="724" y="781" text-anchor="middle" class="cn" fill="#A75A05" font-size="12" font-weight="700">设备控制指令</text>
  </g>

  <!-- AI and data -->
  <g id="layer-ai-data">
    <g id="ai-services" filter="url(#cardShadow)">
      <rect x="1428" y="190" width="422" height="415" rx="28" fill="#FFFFFF" stroke="#D8DEE8"/>
      <text x="1460" y="232" class="cn ink" font-size="23" font-weight="700">智能分析服务</text>
      <text x="1460" y="257" class="en quiet" font-size="10">INTELLIGENCE CAPABILITIES</text>

      <g id="ai-vision">
        <rect x="1460" y="282" width="358" height="82" rx="17" fill="#F3F7FE" stroke="#D4E1F5"/>
        <circle cx="1494" cy="323" r="20" fill="#E2EDFC"/>
        <path d="M1484 323c7-9 14-9 21 0-7 9-14 9-21 0z" fill="none" stroke="#2674D9" stroke-width="2.2"/>
        <circle cx="1494.5" cy="323" r="4" fill="#2674D9"/>
        <text x="1530" y="316" class="cn ink" font-size="17" font-weight="700">口腔影像模型服务</text>
        <text x="1530" y="342" class="cn muted" font-size="13">识别与标注口腔影像</text>
      </g>

      <g id="ai-voice">
        <rect x="1460" y="382" width="358" height="82" rx="17" fill="#F6F3FC" stroke="#E0D8F1"/>
        <circle cx="1494" cy="423" r="20" fill="#ECE6F8"/>
        <path d="M1487 421v4M1494 416v14M1501 419v8" stroke="#7557C8" stroke-width="2.5" stroke-linecap="round"/>
        <text x="1530" y="416" class="cn ink" font-size="17" font-weight="700">实时语音 AI 服务</text>
        <text x="1530" y="442" class="cn muted" font-size="13">语音识别 · 理解 · 合成</text>
      </g>

      <g id="ai-dentist">
        <rect x="1460" y="482" width="358" height="90" rx="17" fill="#F2F8F5" stroke="#D5EADD"/>
        <circle cx="1494" cy="527" r="20" fill="#DFF3E8"/>
        <path d="M1486 516c4-5 12-5 16 0 4 7-2 21-5 23-2-8-4-8-6 0-3-2-9-16-5-23z" fill="none" stroke="#21895B" stroke-width="2"/>
        <text x="1530" y="518" class="cn ink" font-size="17" font-weight="700">AI 牙医</text>
        <text x="1530" y="543" class="cn muted" font-size="13">多图与历史记录综合分析</text>
        <text x="1530" y="562" class="cn" fill="#21895B" font-size="12" font-weight="700">输出口腔健康分析报告</text>
      </g>
    </g>

    <g id="data-center" filter="url(#cardShadow)">
      <rect x="1428" y="635" width="422" height="210" rx="28" fill="#FFFFFF" stroke="#D8DEE8"/>
      <g transform="translate(1460 671)">
        <ellipse cx="28" cy="10" rx="28" ry="10" fill="#E9EEF5" stroke="#667085" stroke-width="2"/>
        <path d="M0 10v47c0 6 13 10 28 10s28-4 28-10V10M0 33c0 6 13 10 28 10s28-4 28-10" fill="none" stroke="#667085" stroke-width="2"/>
      </g>
      <text x="1540" y="691" class="cn ink" font-size="23" font-weight="700">云端数据中心</text>
      <text x="1540" y="719" class="cn muted" font-size="14">统一保存并隔离用户数据</text>
      <line x1="1460" y1="759" x2="1818" y2="759" stroke="#E4E8EF"/>
      <text x="1460" y="792" class="cn muted" font-size="14">账号 · 家庭成员 · 设备 · 口腔影像</text>
      <text x="1460" y="820" class="cn muted" font-size="14">检测结果 · AI 报告 · 对话记录</text>
    </g>
  </g>

  <!-- Cloud to AI/data -->
  <g id="flow-analysis">
    <path d="M1322 518 H1370 Q1388 518 1388 452 V323 Q1388 323 1428 323" fill="none" stroke="#2674D9" stroke-width="4" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
    <path d="M1322 678 H1374 Q1392 678 1392 650 V423 Q1392 423 1428 423" fill="none" stroke="#7557C8" stroke-width="4" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>
    <path d="M1322 558 H1362 Q1382 558 1382 527 H1428" fill="none" stroke="#21895B" stroke-width="4" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
    <rect x="1335" y="298" width="80" height="27" rx="13.5" fill="#E7EFFC"/>
    <text x="1375" y="316" text-anchor="middle" class="cn" fill="#1F5EAF" font-size="11" font-weight="700">影像与结果</text>
    <rect x="1338" y="397" width="76" height="27" rx="13.5" fill="#EEE9F8"/>
    <text x="1376" y="415" text-anchor="middle" class="cn" fill="#6045A8" font-size="11" font-weight="700">语音与回复</text>
  </g>

  <g id="flow-data">
    <path d="M1322 790 H1378 Q1398 790 1398 740 H1428" fill="none" stroke="#667085" stroke-width="3" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
    <rect x="1338" y="752" width="76" height="27" rx="13.5" fill="#EEF1F5"/>
    <text x="1376" y="770" text-anchor="middle" class="cn muted" font-size="11" font-weight="700">业务数据</text>
  </g>

  <!-- Legend and note -->
  <g id="legend" transform="translate(70 925)">
    <text x="0" y="0" class="en muted" font-size="11" font-weight="700">INFORMATION FLOW</text>
    <g transform="translate(0 32)">
      <line x1="0" y1="0" x2="38" y2="0" stroke="#2674D9" stroke-width="4"/>
      <text x="50" y="5" class="cn muted" font-size="13">口腔影像</text>
      <line x1="150" y1="0" x2="188" y2="0" stroke="#7557C8" stroke-width="4"/>
      <text x="200" y="5" class="cn muted" font-size="13">语音与对话</text>
      <line x1="324" y1="0" x2="362" y2="0" stroke="#D97706" stroke-width="3" stroke-dasharray="8 7"/>
      <text x="374" y="5" class="cn muted" font-size="13">设备控制</text>
      <line x1="488" y1="0" x2="526" y2="0" stroke="#667085" stroke-width="3"/>
      <text x="538" y="5" class="cn muted" font-size="13">业务数据</text>
      <line x1="644" y1="0" x2="682" y2="0" stroke="#21895B" stroke-width="4"/>
      <text x="694" y="5" class="cn muted" font-size="13">分析报告</text>
    </g>
  </g>

  <g transform="translate(1322 925)">
    <rect width="528" height="72" rx="20" fill="#FFFFFF" stroke="#D8DEE8"/>
    <text x="24" y="30" class="cn ink" font-size="15" font-weight="700">一套平台连接网页、智能硬件与 AI 服务</text>
    <text x="24" y="54" class="cn muted" font-size="13">完成口腔数据采集、分析、管理和交互反馈</text>
  </g>

  <text x="70" y="1033" class="en quiet" font-size="10">DENTISCOPE · INTELLIGENT ORAL HEALTH SYSTEM</text>
  <text x="1850" y="1033" text-anchor="end" class="cn quiet" font-size="11">齿镜项目系统总览</text>
</svg>
