<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DentiScope System Initialization</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen" aria-label="DentiScope startup screen">
      <section class="clock" aria-label="Current time">
        <p class="time">10:42 <span>AM</span></p>
        <p class="date">2026/7/18</p>
      </section>

      <!-- The loading state is shown for three seconds, then START is revealed. -->
      <section class="launch-state" aria-label="System startup">
        <div class="loading-state" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <p>INITIALIZING SYSTEM</p>
        </div>
        <a class="start-button" href="../03_home/index.html">START</a>
      </section>

      <footer class="brand">DentiScope</footer>
    </main>
    <script src="init-flow.js"></script>
  </body>
</html>
